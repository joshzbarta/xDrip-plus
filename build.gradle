// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    //ext.kotlin_version = '2.0.0-Beta1'
    //ext.hilt_version = '2.44'
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        // Upgrading AGP to a newer version also updates the data binding library.
        // This causes build failures with mixed case package names currently in use.
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.google.gms:google-services:4.3.10'
        classpath 'com.github.jamorham:ReplaceTokenPreprocessor:1.5'
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.6'
        //classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}
plugins {
    id 'java-library'
    id 'maven-publish'
    id "io.freefair.lombok" version "8.7.1"
    id 'org.jetbrains.kotlin.android' version '1.9.21' apply false //version "2.0.20-RC"
    ////id 'com.google.devtools.ksp' version '1.9.21-1.0.16' apply false
    //id 'com.google.devtools.ksp' version '' apply false
}
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
    }
    repositories {
        //google()
        //mavenCentral()
        //maven { url "https://jitpack.io" }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}